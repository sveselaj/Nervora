[project]
name = "nervora"
version = "0.1.0"
description = "Nervora — Secure MCP Gateway for Enterprise AI Tool Execution (Internal R&D Reference Architecture)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Inovativi R&D" }]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The shared libraries live under packages/ and are importable as top-level
# modules (auth, rbac, audit, pii, telemetry, tool_registry,
# databricks_connector, servicebus). Service entrypoints live under apps/.
[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/mcp-gateway", "apps/worker"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
