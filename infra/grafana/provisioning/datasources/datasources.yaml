apiVersion: 1
# The collector exposes span-derived metrics on :8889 (Prometheus format).
# In a fuller setup you would add a Prometheus instance to scrape it and point
# this datasource at it; for the demo we point Grafana directly at the
# collector's scrape endpoint via the Prometheus datasource.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://otel-collector:8889
    isDefault: true
    editable: true
